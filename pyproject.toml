[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eitaas-linux"
version = "1.0.0rc1"
description = "Community Linux diagnostics and eitaas-remmina launcher for EITaaS AVD"
readme = "README.md"
requires-python = ">=3.10"
# Keep the table form until Ubuntu 24.04's setuptools supports PEP 639's
# SPDX-string form. Distribution packages install LICENSE/NOTICE separately.
license = { text = "MIT" }
authors = [{ name = "EITaaS-Linux contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# The helper GUI uses the distribution's PyGObject/GTK 4/Libadwaita packages
# (python3-gi + gir1.2-gtk-4.0 + gir1.2-adw-1, python3-gobject + gtk4 +
# libadwaita, python-gobject + gtk4 + libadwaita). This extra exists for
# virtual-environment installs; ``eitaas`` itself never imports PyGObject.
gui = ["PyGObject>=3.46"]

[project.scripts]
eitaas = "eitaas.cli:main"
eitaas-gui = "eitaas_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
