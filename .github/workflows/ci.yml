name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: scripts/check-repository-artifacts.sh
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.python-version }}
          path: dist/*

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify canonical source archive
        run: |
          scripts/check-version-consistency.py
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/verify-source-tarball.py "$archive" --ref HEAD
      - name: Verify deterministic output
        run: |
          mkdir reproducibility-check
          scripts/build-source-tarball.sh HEAD reproducibility-check
          cmp dist/eitaas-linux-*.tar.gz reproducibility-check/eitaas-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source-tarball
          path: dist/eitaas-linux-*.tar.gz

  deb-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential debhelper dh-python pybuild-plugin-pyproject python3-all
          python3-setuptools python3-wheel lintian
      - name: Build DEB from canonical source
        run: |
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/build-deb.sh "$archive"
      - run: >-
          lintian --suppress-tags
          bad-distribution-in-changes-file,initial-upload-closes-no-bugs
          dist/*.changes
      - run: sudo apt-get install -y ./dist/eitaas-linux_0.1.0-1_all.deb
      - run: eitaas --version
      - name: Run installed diagnostics
        run: |
          status=0
          eitaas doctor --json > doctor.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
      - run: sudo apt-get remove -y eitaas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            dist/*.deb
            dist/*.dsc
            dist/*.debian.tar.*
            dist/*.orig.tar.*
            dist/*.buildinfo
            dist/*.changes

  rpm-package:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: >-
          dnf install -y git findutils rpm-build python3-devel
          python3-setuptools pyproject-rpm-macros python3-wheel rpmlint
      - uses: actions/checkout@v4
      - name: Build RPM from canonical source
        run: |
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/build-rpm.sh "$archive"
      - run: rpmlint packaging/rpm/eitaas-linux.spec dist/*.rpm
      - run: dnf install -y dist/eitaas-linux-*.noarch.rpm
      - run: eitaas --version
      - name: Run installed diagnostics
        run: |
          status=0
          eitaas doctor --json > doctor.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
      - run: dnf remove -y eitaas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed base-devel git namcap
          python-build python-installer python-setuptools python-wheel
          freerdp opensc pcsclite ccid pcsc-tools
      - uses: actions/checkout@v4
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c '
            archive=$(scripts/build-source-tarball.sh HEAD dist)
            scripts/build-arch.sh "$archive"
          '
      - run: namcap packaging/arch/PKGBUILD dist/*.pkg.tar.zst
      - run: pacman -U --noconfirm dist/eitaas-linux-*.pkg.tar.zst
      - run: eitaas --version
      - name: Run installed diagnostics
        run: |
          status=0
          eitaas doctor --json > doctor.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
      - run: pacman -R --noconfirm eitaas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  remmina-deb-package:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:13
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y
          build-essential cmake debhelper devscripts dpkg-dev gettext git
          gnutls-bin libcurl4-openssl-dev libgtk-3-dev libicu-dev libjson-c-dev
          libjson-glib-dev libkrb5-dev libpcsclite-dev libsecret-1-dev
          libsodium-dev libsoup-3.0-dev libssh-dev libssl-dev
          libusb-1.0-0-dev libwebkit2gtk-4.1-dev lintian ninja-build opensc
          patch pcscd python3 zlib1g-dev
      - uses: actions/checkout@v4
      - name: Resolve pinned versions from the packaging manifests
        run: |
          manifest=packaging/remmina/sources.json
          read_manifest() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sources"][sys.argv[2]][sys.argv[3]])' \
              "$manifest" "$1" "$2"
          }
          deb_version=$(dpkg-parsechangelog -l packaging/remmina/debian/changelog -S Version)
          {
            # Debian artifact file names carry no epoch.
            echo "DEB_VERSION=${deb_version#*:}"
            echo "FREERDP_VERSION=$(read_manifest freerdp version)"
            echo "REMMINA_COMMIT=$(read_manifest remmina commit)"
          } >>"$GITHUB_ENV"
      - name: Build binary and native source packages
        run: scripts/build-remmina-deb.sh
      - name: Verify Debian policy metadata
        run: |
          lintian --suppress-tags bad-distribution-in-changes-file,initial-upload-closes-no-bugs,no-manual-page,file-without-copyright-information,inconsistent-appstream-metadata-license \
            "dist/eitaas-remmina_${DEB_VERSION}_amd64.changes"
      - name: Test install, upgrade, dependencies, and removal
        run: scripts/test-remmina-deb-lifecycle.sh "dist/eitaas-remmina_${DEB_VERSION}_amd64.deb"
      - name: Verify corresponding source contents
        run: |
          target=$(mktemp -d)
          dpkg-source --extract "dist/eitaas-remmina_${DEB_VERSION}.dsc" "$target/source"
          test -f "$target/source/FreeRDP-${FREERDP_VERSION}/LICENSE"
          test -f "$target/source/Remmina-${REMMINA_COMMIT}/COPYING"
          test -f "$target/source/sources.json"
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["patches"]))' \
            packaging/remmina/sources.json >"$target/patches.txt"
          while read -r patch; do
            test -f "$target/source/patches/$patch"
          done <"$target/patches.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remmina-deb-${{ matrix.name }}
          path: |
            dist/eitaas-remmina*.deb
            dist/eitaas-remmina*.ddeb
            dist/eitaas-remmina*.dsc
            dist/eitaas-remmina*.tar.xz
            dist/eitaas-remmina*.buildinfo
            dist/eitaas-remmina*.changes

  remmina-arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Report Arch validation scope
        run: |
          snapshot=$(cat packaging/remmina/arch/SNAPSHOT)
          echo "Release/reproducibility snapshot: $snapshot"
          echo "GitHub CI uses current official repositories for compatibility validation."
      - name: Install build dependencies
        run: >-
          pacman -Syyu --noconfirm --needed base-devel cmake curl gettext git
          gnutls gtk3 icu json-c json-glib krb5 libsecret libsodium libsoup3
          libssh namcap ninja opensc openssl patch pcsclite python
          webkit2gtk-4.1
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder "$GITHUB_WORKSPACE/.build" "$GITHUB_WORKSPACE/dist"
          runuser -u builder -- scripts/build-remmina-arch.sh
      - name: Check package metadata and contents
        run: namcap .build/eitaas-remmina-arch/package/PKGBUILD dist/eitaas-remmina-*.pkg.tar.zst
      - name: Test install, dependencies, and removal
        run: scripts/test-remmina-arch-lifecycle.sh dist/eitaas-remmina-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remmina-arch-package
          path: |
            dist/eitaas-remmina-*.pkg.tar.zst
            .build/eitaas-remmina-arch/eitaas-remmina-*-source.tar.gz
