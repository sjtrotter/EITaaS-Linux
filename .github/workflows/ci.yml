name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Install GTK 4 / Libadwaita for the GUI smoke test
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 desktop-file-utils
          appstream shared-mime-info
      # setup-python's interpreter cannot import the distribution `gi`, so the
      # smoke test runs under the system python (it skips when gi is missing).
      - name: GUI smoke test under Xvfb
        run: xvfb-run -a /usr/bin/python3 -m unittest tests.test_gui_smoke -v
        env:
          PYTHONPATH: src
      - run: scripts/check-repository-artifacts.sh
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.python-version }}
          path: dist/*

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify canonical source archive
        run: |
          scripts/check-version-consistency.py
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/verify-source-tarball.py "$archive" --ref HEAD
      - name: Verify deterministic output
        run: |
          mkdir reproducibility-check
          scripts/build-source-tarball.sh HEAD reproducibility-check
          cmp dist/eitaas-linux-*.tar.gz reproducibility-check/eitaas-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source-tarball
          path: dist/eitaas-linux-*.tar.gz

  deb-package:
    # One job per distribution builds the single combined eitaas-linux package
    # (#80): the private Remmina/FreeRDP bundle, the CLI, and the helper GUI.
    # The recipes force `--parallel 1` as a packaging-reproducibility rule, so
    # this job compiles both upstreams serially.
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:13
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y
          build-essential cmake debhelper desktop-file-utils devscripts
          dh-python dpkg-dev gettext git gnutls-bin libcurl4-openssl-dev
          libgtk-3-dev libicu-dev libjson-c-dev libjson-glib-dev libkrb5-dev
          libpcsclite-dev libsecret-1-dev libsodium-dev libsoup-3.0-dev
          libssh-dev libssl-dev libusb-1.0-0-dev libwebkit2gtk-4.1-dev
          lintian ninja-build opensc patch pcscd pybuild-plugin-pyproject
          python3 python3-all python3-setuptools python3-wheel zlib1g-dev
      - uses: actions/checkout@v4
      - name: Resolve pinned versions from the packaging manifests
        run: |
          manifest=packaging/remmina/sources.json
          read_manifest() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sources"][sys.argv[2]][sys.argv[3]])' \
              "$manifest" "$1" "$2"
          }
          deb_version=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          {
            # Debian artifact file names carry no epoch.
            echo "DEB_VERSION=${deb_version#*:}"
            echo "FREERDP_VERSION=$(read_manifest freerdp version)"
            echo "REMMINA_COMMIT=$(read_manifest remmina commit)"
          } >>"$GITHUB_ENV"
      - name: Build the combined package from canonical source
        run: |
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/build-deb.sh "$archive"
      - name: Verify Debian policy metadata
        run: |
          # odd-historical-debian-changelog-version: 0.1.0-1 predates the #80
          # merge, when the package was not yet Debian-native.
          lintian --suppress-tags bad-distribution-in-changes-file,initial-upload-closes-no-bugs,no-manual-page,file-without-copyright-information,inconsistent-appstream-metadata-license,odd-historical-debian-changelog-version \
            "dist/eitaas-linux_${DEB_VERSION}_amd64.changes"
      - name: Test install, upgrade from the split packages, and removal
        run: scripts/test-deb-lifecycle.sh "dist/eitaas-linux_${DEB_VERSION}_amd64.deb"
      - name: Verify corresponding source contents
        run: |
          target=$(mktemp -d)
          dpkg-source --extract "dist/eitaas-linux_${DEB_VERSION}.dsc" "$target/source"
          test -f "$target/source/FreeRDP-${FREERDP_VERSION}/LICENSE"
          test -f "$target/source/Remmina-${REMMINA_COMMIT}/COPYING"
          test -f "$target/source/packaging/remmina/sources.json"
          test -f "$target/source/src/eitaas/__init__.py"
          test -f "$target/source/src/eitaas_gui/main.py"
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["patches"]))' \
            packaging/remmina/sources.json >"$target/patches.txt"
          while read -r patch; do
            test -f "$target/source/packaging/remmina/$patch"
          done <"$target/patches.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-package-${{ matrix.name }}
          path: |
            dist/eitaas-linux*.deb
            dist/eitaas-linux*.ddeb
            dist/eitaas-linux*.dsc
            dist/eitaas-linux*.tar.xz
            dist/eitaas-linux*.buildinfo
            dist/eitaas-linux*.changes

  rpm-package:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: >-
          dnf install -y git findutils rpm-build rpmlint
          python3-devel python3-setuptools pyproject-rpm-macros python3-wheel
          desktop-file-utils appstream cmake gcc gcc-c++ ninja-build patch
          gtk3-devel json-c-devel json-glib-devel krb5-devel libcurl-devel
          libicu-devel libsecret-devel libsodium-devel libsoup3-devel
          libssh-devel openssl-devel pcsc-lite-devel webkit2gtk4.1-devel
      - uses: actions/checkout@v4
      - name: Build the combined package from canonical source
        run: |
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/build-rpm.sh "$archive"
      - run: rpmlint -r packaging/rpm/eitaas-linux.rpmlintrc packaging/rpm/eitaas-linux.spec dist/*.rpm
      - name: Verify corresponding source contents
        run: |
          read_manifest() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sources"][sys.argv[2]][sys.argv[3]])' \
              packaging/remmina/sources.json "$1" "$2"
          }
          rpm -qlp dist/eitaas-linux-*.src.rpm >srpm-files.txt
          grep -qx "$(read_manifest freerdp version).tar.gz" srpm-files.txt
          grep -qx "Remmina-$(read_manifest remmina commit).tar.gz" srpm-files.txt
          grep -q '\.tar\.gz$' srpm-files.txt
          grep -qx eitaas-linux.spec srpm-files.txt
      - name: Test install, upgrade from the split packages, and removal
        run: scripts/test-rpm-lifecycle.sh dist/eitaas-linux-*.x86_64.rpm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpm-package
          path: dist/*.rpm

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syyu --noconfirm --needed base-devel cmake curl desktop-file-utils
          gettext git gnutls gtk3 gtk4 icu json-c json-glib krb5 libadwaita
          libsecret libsodium libsoup3 libssh namcap ninja opensc openssl patch
          pcsclite ccid pcsc-tools python python-build python-gobject
          python-installer python-setuptools python-wheel webkit2gtk-4.1 zstd
      - uses: actions/checkout@v4
      - name: Report Arch validation scope
        run: |
          snapshot=$(cat packaging/remmina/SNAPSHOT)
          echo "Release/reproducibility snapshot: $snapshot"
          echo "GitHub CI uses current official repositories for compatibility validation."
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder "$GITHUB_WORKSPACE/.build" "$GITHUB_WORKSPACE/dist"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c '
            archive=$(scripts/build-source-tarball.sh HEAD dist)
            scripts/build-arch.sh "$archive"
          '
      - run: namcap .build/eitaas-bundle/package/PKGBUILD dist/eitaas-linux-*.pkg.tar.zst
      - name: Test install, upgrade, and removal
        run: scripts/test-arch-lifecycle.sh dist/eitaas-linux-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-package
          path: |
            dist/eitaas-linux-*.pkg.tar.zst
            .build/eitaas-bundle/eitaas-linux-*-source.tar.gz

  remmina-upstream-series:
    # Applies upstream/remmina/*.patch with `git am` onto the recorded Remmina
    # master base and builds remmina-plugin-rdp against the pinned FreeRDP with
    # WebKit AAD support enabled and disabled. This is a compile check, not a
    # package build, so it uses every core; the `--parallel 1` in the spec and
    # debian/rules is a packaging-reproducibility rule that does not apply here.
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      REMMINA_BASE: c620366ed85def5c3de2549eec7fcbef577281d8
      REMMINA_CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Wall
        -DWITH_FREERDP3=ON -DWITH_RDP=ON -DWITH_SSO_MIB=OFF
        -DWITH_GCRYPT=OFF -DWITH_VTE=OFF -DHAVE_LIBAPPINDICATOR=OFF
        -DWITH_CUPS=OFF -DWITH_AVAHI=OFF
        -DWITH_LIBVNCSERVER=OFF -DWITH_SPICE=OFF -DWITH_NEWS=OFF -DWITH_STATS=OFF
        -DWITH_TIP=OFF -DWITH_MANPAGES=OFF -DWITH_ICON_CACHE=OFF -DWITH_WWW=OFF
        -DWITH_GVNC=OFF -DWITH_X2GO=OFF -DWITH_KF5WALLET=OFF -DWITH_ST=OFF
        -DWITH_XDMCP=OFF -DWITH_NX=OFF -DWITH_PYTHONLIBS=OFF
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y
          build-essential ca-certificates cmake curl git gettext gnutls-bin
          libcurl4-openssl-dev libgtk-3-dev libicu-dev libjson-c-dev
          libjson-glib-dev libkrb5-dev libpcsclite-dev libsecret-1-dev
          libsodium-dev libsoup-3.0-dev libssh-dev libssl-dev
          libusb-1.0-0-dev libwebkit2gtk-4.1-dev ninja-build python3 zlib1g-dev
      - uses: actions/checkout@v4
      - name: Read the FreeRDP pin
        run: |
          read_manifest() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sources"]["freerdp"][sys.argv[2]])' \
              packaging/remmina/sources.json "$1"
          }
          {
            echo "FREERDP_VERSION=$(read_manifest version)"
            echo "FREERDP_URL=$(read_manifest url)"
            echo "FREERDP_SHA256=$(read_manifest sha256)"
          } >>"$GITHUB_ENV"
      - name: Restore the installed FreeRDP from cache
        id: freerdp-cache
        uses: actions/cache@v4
        with:
          path: freerdp-prefix
          key: remmina-upstream-series-freerdp-${{ env.FREERDP_SHA256 }}-ubuntu-24.04
      - name: Build the pinned FreeRDP
        if: steps.freerdp-cache.outputs.cache-hit != 'true'
        run: |
          version=$FREERDP_VERSION
          curl -fsSL -o freerdp.tar.gz "$FREERDP_URL"
          echo "$FREERDP_SHA256  freerdp.tar.gz" | sha256sum -c -
          tar -xzf freerdp.tar.gz
          cmake -S "FreeRDP-$version" -B freerdp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/freerdp-prefix" \
            -DWITH_AAD=ON -DWITH_PCSC=ON -DWITH_SSO_MIB=OFF -DWITH_CLIENT=ON \
            -DWITH_CLIENT_SDL=OFF -DWITH_X11=OFF -DWITH_WAYLAND=OFF -DWITH_SERVER=OFF \
            -DWITH_SAMPLE=OFF -DWITH_MANPAGES=OFF -DWITH_DOCUMENTATION=OFF -DWITH_FUSE=OFF \
            -DWITH_CUPS=OFF -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_CAIRO=OFF \
            -DWITH_ALSA=OFF -DWITH_PULSE=OFF -DWITH_JPEG=OFF -DWITH_GSM=OFF \
            -DWITH_LAME=OFF -DWITH_OPENH264=OFF
          cmake --build freerdp-build --parallel "$(nproc)"
          cmake --install freerdp-build
      - name: Apply the series onto the recorded Remmina base
        run: |
          git init -q remmina
          git -C remmina fetch --depth 1 https://gitlab.com/Remmina/Remmina.git "$REMMINA_BASE"
          git -C remmina checkout -q FETCH_HEAD
          git -C remmina -c user.name=ci -c user.email=ci@example.invalid am "$PWD"/upstream/remmina/*.patch
          git -C remmina log --oneline "FETCH_HEAD..HEAD"
      - name: Build remmina-plugin-rdp at every commit (bisectable), then the tip without AAD
        run: |
          build() {
            cmake -S remmina -B "remmina-build-$1" -G Ninja \
              -DCMAKE_PREFIX_PATH="$PWD/freerdp-prefix" -DWITH_RDP_AUTH_AAD=$1 $REMMINA_CMAKE_FLAGS
            cmake --build "remmina-build-$1" --target remmina-plugin-rdp --parallel "$(nproc)"
            test -f "remmina-build-$1/plugins/rdp/remmina-plugin-rdp.so"
          }
          tip=$(git -C remmina rev-parse HEAD)
          for commit in $(git -C remmina rev-list --reverse "FETCH_HEAD..$tip"); do
            git -C remmina checkout -q "$commit"
            echo "::group::AAD=ON $(git -C remmina log --oneline -1)"
            build ON
            echo "::endgroup::"
          done
          git -C remmina checkout -q "$tip"
          build OFF
          # The PKCS #11 sources are gated on the AAD feature.
          ! grep -q rdp_web_auth_pkcs11 remmina-build-OFF/build.ninja
