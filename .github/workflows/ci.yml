name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: scripts/check-repository-artifacts.sh
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.python-version }}
          path: dist/*

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deb-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential debhelper dh-python pybuild-plugin-pyproject python3-all
          python3-setuptools python3-wheel lintian
      - run: scripts/build-deb.sh
      - run: >-
          lintian --suppress-tags
          bad-distribution-in-changes-file,initial-upload-closes-no-bugs
          dist/eitaas-linux_0.1.0-1_amd64.changes
      - run: sudo apt-get install -y ./dist/eitaas-linux_0.1.0-1_all.deb
      - run: eitaas --version
      - name: Run installed diagnostics
        run: |
          status=0
          eitaas doctor --json > doctor.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
      - run: sudo apt-get remove -y eitaas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            dist/*.deb
            dist/*.buildinfo
            dist/*.changes

  rpm-package:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: >-
          dnf install -y git findutils rpm-build python3-devel
          python3-setuptools pyproject-rpm-macros python3-wheel rpmlint
      - uses: actions/checkout@v4
      - run: scripts/build-rpm.sh
      - run: rpmlint packaging/rpm/eitaas-linux.spec dist/*.rpm
      - run: dnf install -y dist/eitaas-linux-0.1.0-1.fc44.noarch.rpm
      - run: eitaas --version
      - name: Run installed diagnostics
        run: |
          status=0
          eitaas doctor --json > doctor.json || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
      - run: dnf remove -y eitaas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm
