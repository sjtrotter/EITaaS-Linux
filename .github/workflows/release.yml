name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source-python:
    if: github.repository == 'sjtrotter/EITaaS-Linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build cyclonedx-bom
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: scripts/check-repository-artifacts.sh
      - run: scripts/check-version-consistency.py
      - name: Require tag and project versions to match
        if: github.ref_type == 'tag'
        run: scripts/check-version-consistency.py --tag "$GITHUB_REF_NAME"
      - name: Build and verify canonical source archive
        run: |
          archive=$(scripts/build-source-tarball.sh HEAD dist)
          scripts/verify-source-tarball.py "$archive" --ref HEAD
      - name: Verify deterministic source archive
        run: |
          mkdir reproducibility-check
          scripts/build-source-tarball.sh HEAD reproducibility-check
          cmp dist/eitaas-linux-*.tar.gz reproducibility-check/eitaas-linux-*.tar.gz
      - run: python -m build
      - run: cyclonedx-py environment --output-file dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-python
          path: dist/*

  deb:
    needs: source-python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source-python
          path: source-artifacts
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake debhelper desktop-file-utils devscripts
          dh-python dpkg-dev gettext git gnutls-bin libcurl4-openssl-dev
          libgtk-3-dev libicu-dev libjson-c-dev libjson-glib-dev libkrb5-dev
          libpcsclite-dev libsecret-1-dev libsodium-dev libsoup-3.0-dev
          libssh-dev libssl-dev libusb-1.0-0-dev libwebkit2gtk-4.1-dev
          lintian ninja-build opensc patch pcscd pybuild-plugin-pyproject
          python3-all python3-setuptools python3-wheel zlib1g-dev
      - run: scripts/build-deb.sh source-artifacts/eitaas-linux-*.tar.gz
      - run: >-
          lintian --suppress-tags
          bad-distribution-in-changes-file,initial-upload-closes-no-bugs,no-manual-page,file-without-copyright-information,inconsistent-appstream-metadata-license,odd-historical-debian-changelog-version
          dist/*.changes
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: |
            dist/*.deb
            dist/*.dsc
            dist/*.debian.tar.*
            dist/*.orig.tar.*
            dist/*.buildinfo
            dist/*.changes

  rpm:
    needs: source-python
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: >-
          dnf install -y git findutils libusb1-devel rpm-build rpmlint
          python3-devel python3-setuptools pyproject-rpm-macros python3-wheel
          desktop-file-utils appstream cmake gcc gcc-c++ gettext ninja-build
          patch gtk3-devel json-c-devel json-glib-devel krb5-devel
          libcurl-devel libicu-devel libsecret-devel libsodium-devel
          libsoup3-devel libssh-devel openssl-devel
          pcsc-lite-devel webkit2gtk4.1-devel zlib-devel
          gtk4 libadwaita python3-gobject
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source-python
          path: source-artifacts
      - run: scripts/build-rpm.sh source-artifacts/eitaas-linux-*.tar.gz
      - run: rpmlint -r packaging/rpm/eitaas-linux.rpmlintrc packaging/rpm/eitaas-linux.spec dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: dist/*.rpm

  arch:
    needs: source-python
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: >-
          pacman -Syyu --noconfirm --needed base-devel cmake curl desktop-file-utils libusb
          gettext git gnutls gtk3 gtk4 icu json-c json-glib krb5 libadwaita
          libsecret libsodium libsoup3 libssh namcap ninja opensc openssl patch
          pcsclite ccid pcsc-tools python python-build python-gobject
          python-installer python-setuptools python-wheel webkit2gtk-4.1 zstd
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source-python
          path: source-artifacts
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- scripts/build-arch.sh source-artifacts/eitaas-linux-*.tar.gz
      - run: namcap .build/eitaas-bundle/package/PKGBUILD dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: dist/*.pkg.tar.zst

  assemble:
    needs: [source-python, deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate and verify checksum manifest
        run: |
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          cd release-artifacts
          find . -maxdepth 1 -type f -printf '%f\0' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$manifest"
          mv "$manifest" SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidate
          path: release-artifacts/*

  attest:
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-candidate
          path: release-artifacts
      - name: Attest release artifacts and checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: attested-release-candidate
          path: release-artifacts/*
