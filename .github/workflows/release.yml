name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'sjtrotter/EITaaS-Linux'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build cyclonedx-bom
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: scripts/check-repository-artifacts.sh
      - run: python -m build
      - run: sha256sum dist/* > SHA256SUMS
      - run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidate
          path: |
            dist/*
            SHA256SUMS
            sbom.cdx.json
